name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: Amplify

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      TAG_NAME: ${{ github.ref_name }}
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release version
        run: |
          echo "APP_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Build arm64
        working-directory: WritingHub
        run: swift build -c release --arch arm64

      - name: Build x86_64
        working-directory: WritingHub
        run: swift build -c release --arch x86_64

      - name: Create universal binary with lipo
        working-directory: WritingHub
        run: |
          lipo -create \
            .build/arm64-apple-macosx/release/WritingHub \
            .build/x86_64-apple-macosx/release/WritingHub \
            -output WritingHub-universal

      - name: Create .app bundle
        run: |
          mkdir -p "${APP_NAME}.app/Contents/MacOS"
          mkdir -p "${APP_NAME}.app/Contents/Resources"
          mkdir -p "${APP_NAME}.iconset"

          cp WritingHub/WritingHub-universal "${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_NAME}.app/Contents/MacOS/${APP_NAME}"

          # SwiftPM-generated Bundle.module accessors look for companion bundles at the app root.
          cp -R WritingHub/.build/arm64-apple-macosx/release/*.bundle \
            "${APP_NAME}.app/" 2>/dev/null || true

          cp WritingHub/Sources/WritingHub/Info.plist "${APP_NAME}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${APP_NAME}" "${APP_NAME}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APP_VERSION}" "${APP_NAME}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "${APP_NAME}.app/Contents/Info.plist"

          sips -z 16 16     landing/logo.png --out "${APP_NAME}.iconset/icon_16x16.png"
          sips -z 32 32     landing/logo.png --out "${APP_NAME}.iconset/icon_16x16@2x.png"
          sips -z 32 32     landing/logo.png --out "${APP_NAME}.iconset/icon_32x32.png"
          sips -z 64 64     landing/logo.png --out "${APP_NAME}.iconset/icon_32x32@2x.png"
          sips -z 128 128   landing/logo.png --out "${APP_NAME}.iconset/icon_128x128.png"
          sips -z 256 256   landing/logo.png --out "${APP_NAME}.iconset/icon_128x128@2x.png"
          sips -z 256 256   landing/logo.png --out "${APP_NAME}.iconset/icon_256x256.png"
          sips -z 512 512   landing/logo.png --out "${APP_NAME}.iconset/icon_256x256@2x.png"
          sips -z 512 512   landing/logo.png --out "${APP_NAME}.iconset/icon_512x512.png"
          cp landing/logo.png "${APP_NAME}.iconset/icon_512x512@2x.png"
          iconutil -c icns "${APP_NAME}.iconset" -o "${APP_NAME}.app/Contents/Resources/AppIcon.icns"

      - name: Codesign
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          /usr/bin/codesign --force --deep --options runtime \
            --sign "${APPLE_SIGNING_IDENTITY}" "${APP_NAME}.app"

      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "${APP_NAME}.app" "${APP_NAME}-notarize.zip"
          xcrun notarytool submit "${APP_NAME}-notarize.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${APP_NAME}.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${APP_NAME}.app" \
            -ov -format UDZO \
            "${APP_NAME}.dmg"

      - name: Create ZIP
        run: |
          ditto -c -k --keepParent "${APP_NAME}.app" "${APP_NAME}.zip"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG_NAME}" \
            "${APP_NAME}.zip" \
            "${APP_NAME}.dmg" \
            --title "${APP_NAME} ${TAG_NAME}" \
            --generate-notes
